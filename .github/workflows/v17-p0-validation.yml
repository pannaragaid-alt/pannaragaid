name: V17 P0 Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download and verify the uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P0_CONTINUATION.zip"
          url="https://raw.githubusercontent.com/pannaragaid-alt/pannaragaid/8a0cefc150b49d15ab8ab6e67a7dba75691385ff/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P0_CONTINUATION.zip"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 120 "$url" --output "$archive"
          echo "e5fe7807e1b875fc900f60c7c3d643d40629d1ed2ece3751cc2b4229df7dbd36  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/v17-source"
          python -m zipfile -e "$archive" "$RUNNER_TEMP/v17-source"
          test -f "$RUNNER_TEMP/v17-source/pyproject.toml"
          echo "Source archive integrity and extraction: PASS"

      - name: Install project and test dependencies
        working-directory: ${{ runner.temp }}/v17-source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check

      - name: Run complete test suite
        working-directory: ${{ runner.temp }}/v17-source
        run: python -m pytest -q

      - name: Compile source and tests
        working-directory: ${{ runner.temp }}/v17-source
        run: python -m compileall -q v17_niche_intel tests

      - name: Build wheel
        working-directory: ${{ runner.temp }}/v17-source
        run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/dist"

  security:
    name: Security scanners (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download and verify the uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P0_CONTINUATION.zip"
          url="https://raw.githubusercontent.com/pannaragaid-alt/pannaragaid/8a0cefc150b49d15ab8ab6e67a7dba75691385ff/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P0_CONTINUATION.zip"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 120 "$url" --output "$archive"
          echo "e5fe7807e1b875fc900f60c7c3d643d40629d1ed2ece3751cc2b4229df7dbd36  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/v17-source"
          python -m zipfile -e "$archive" "$RUNNER_TEMP/v17-source"
          test -f "$RUNNER_TEMP/v17-source/pyproject.toml"
          echo "Source archive integrity and extraction: PASS"

      - name: Install project and security tooling
        working-directory: ${{ runner.temp }}/v17-source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,security]'
          python -m pip check

      - name: Ruff
        working-directory: ${{ runner.temp }}/v17-source
        run: ruff check v17_niche_intel tests

      - name: Bandit
        working-directory: ${{ runner.temp }}/v17-source
        run: bandit -q -ll -r v17_niche_intel

      - name: Dependency vulnerability audit
        working-directory: ${{ runner.temp }}/v17-source
        run: pip-audit --strict

      - name: Semgrep security audit
        working-directory: ${{ runner.temp }}/v17-source
        run: semgrep scan --config p/security-audit --severity ERROR --error v17_niche_intel
