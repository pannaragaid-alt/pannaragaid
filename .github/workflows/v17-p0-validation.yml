name: V17 P1 Operational Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P1_OPERATIONAL_HARDENED.zip"
          url="https://raw.githubusercontent.com/pannaragaid-alt/pannaragaid/${{ github.sha }}/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P1_OPERATIONAL_HARDENED.zip"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 120 "$url" --output "$archive"
          echo "578345329c0f5f5542936ad2bcfc67367e17fbef0f084ddddbda05091e348a82  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/v17-source"
          python -m zipfile -e "$archive" "$RUNNER_TEMP/v17-source"
          test -f "$RUNNER_TEMP/v17-source/pyproject.toml"

      - name: Install complete test dependencies
        working-directory: ${{ runner.temp }}/v17-source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[all,dev,security,firecrawl,secrets]' 'requests>=2.32,<3'
          python -m pip check

      - name: Run complete test suite
        working-directory: ${{ runner.temp }}/v17-source
        run: python -m pytest -q

      - name: Compile source and tests
        working-directory: ${{ runner.temp }}/v17-source
        run: python -m compileall -q v17_niche_intel tests

      - name: Build wheel
        working-directory: ${{ runner.temp }}/v17-source
        run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/dist"

  ruff:
    name: Ruff lint (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download and verify source archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P1_OPERATIONAL_HARDENED.zip"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 120 "https://raw.githubusercontent.com/pannaragaid-alt/pannaragaid/${{ github.sha }}/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P1_OPERATIONAL_HARDENED.zip" --output "$archive"
          echo "578345329c0f5f5542936ad2bcfc67367e17fbef0f084ddddbda05091e348a82  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/v17-source"
          python -m zipfile -e "$archive" "$RUNNER_TEMP/v17-source"
      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.17.6"
      - name: Run Ruff with repository policy
        working-directory: ${{ runner.temp }}/v17-source
        run: ruff check --config pyproject.toml v17_niche_intel tests

  security:
    name: ${{ matrix.scanner }} security scan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scanner: [bandit, pip-audit, semgrep]
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download and verify source archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P1_OPERATIONAL_HARDENED.zip"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 120 "https://raw.githubusercontent.com/pannaragaid-alt/pannaragaid/${{ github.sha }}/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P1_OPERATIONAL_HARDENED.zip" --output "$archive"
          echo "578345329c0f5f5542936ad2bcfc67367e17fbef0f084ddddbda05091e348a82  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/v17-source"
          python -m zipfile -e "$archive" "$RUNNER_TEMP/v17-source"
      - name: Install scanner
        run: |
          case "${{ matrix.scanner }}" in
            bandit) python -m pip install "bandit>=1.8,<2" ;;
            pip-audit) python -m pip install "pip-audit>=2.7,<3" ;;
            semgrep) python -m pip install "semgrep>=1.100,<2" ;;
          esac
      - name: Run scanner
        working-directory: ${{ runner.temp }}/v17-source
        run: |
          case "${{ matrix.scanner }}" in
            bandit) bandit -q -ll -r v17_niche_intel ;;
            pip-audit) pip-audit --strict ;;
            semgrep) semgrep scan --config p/security-audit --severity ERROR --error v17_niche_intel ;;
          esac
