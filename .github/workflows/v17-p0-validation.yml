    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download and verify source archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P1_OPERATIONAL_HARDENED.zip"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 120 "https://raw.githubusercontent.com/pannaragaid-alt/pannaragaid/${{ github.sha }}/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P1_OPERATIONAL_HARDENED.zip" --output "$archive"
          echo "bc0f544210e17d8064f40d22d32dbe03661420f1c26dae2666e683bdf7dc0837  $archive" | sha256sum --check --strict
          python - "$archive" <<'PY'
          import stat, sys, zipfile
          from pathlib import PurePosixPath
          archive_path = sys.argv[1]
          blocked_suffixes = (".sqlite3", ".sqlite", ".sqlite3-wal", ".sqlite3-shm", ".db", ".pem", ".key", ".p12", ".pfx", ".jks")
          blocked_dirs = {".git", "__pycache__", ".pytest_cache", ".ruff_cache", ".venv", "venv", "build", "dist"}
          blocked_names = {"id_rsa", "id_ed25519", "credentials.json", "client_secret.json", "token.json"}
          with zipfile.ZipFile(archive_path) as archive:
              infos = archive.infolist()
              if len(infos) > 10000:
                  raise SystemExit("archive exceeds entry limit")
              seen, total = set(), 0
              for info in infos:
                  name = info.filename
                  if not name or "\\" in name:
                      raise SystemExit(f"invalid archive path: {name!r}")
                  normalized = name[:-1] if info.is_dir() and name.endswith("/") else name
                  path = PurePosixPath(normalized)
                  if path.is_absolute() or not path.parts or ".." in path.parts or "." in path.parts or ":" in path.parts[0]:
                      raise SystemExit(f"unsafe archive path: {name!r}")
                  canonical = "/".join(path.parts).casefold()
                  if canonical in seen:
                      raise SystemExit(f"duplicate archive path: {name!r}")
                  seen.add(canonical)
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode) or info.flag_bits & 1:
                      raise SystemExit(f"symlink/encrypted member rejected: {name!r}")
                  parts = {part.casefold() for part in path.parts}
                  base = path.name.casefold()
                  if parts & blocked_dirs or any(part.endswith(".egg-info") for part in parts):
                      raise SystemExit(f"build/cache path rejected: {name!r}")
                  if base != ".env.example" and (base == ".env" or base.startswith(".env.")):
                      raise SystemExit(f"environment file rejected: {name!r}")
                  if base.endswith(blocked_suffixes) or base in blocked_names:
                      raise SystemExit(f"database/secret file rejected: {name!r}")
                  if not info.is_dir():
                      total += info.file_size
                      if info.file_size > 20 * 1024 * 1024:
                          raise SystemExit(f"member too large: {name!r}")
                      if info.file_size and (not info.compress_size or info.file_size / info.compress_size > 1000):
                          raise SystemExit(f"suspicious compression ratio: {name!r}")
              if total > 100 * 1024 * 1024:
                  raise SystemExit("archive expands beyond 100 MiB")
          print("Pre-extraction ZIP policy: PASS")
          PY
          mkdir -p "$RUNNER_TEMP/v17-source"
          python -m zipfile -e "$archive" "$RUNNER_TEMP/v17-source"
      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.17.6"
      - name: Run Ruff with repository policy
        working-directory: ${{ runner.temp }}/v17-source
        run: ruff check --config pyproject.toml v17_niche_intel tests

  security:
    name: ${{ matrix.scanner }} security scan (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - scanner: bandit
            python-version: "3.12"
          - scanner: pip-audit
            python-version: "3.11"
          - scanner: pip-audit
            python-version: "3.12"
          - scanner: semgrep
            python-version: "3.12"
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download and verify source archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P1_OPERATIONAL_HARDENED.zip"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 120 "https://raw.githubusercontent.com/pannaragaid-alt/pannaragaid/${{ github.sha }}/V17_GLOBAL_GROWTH_ENGINE_0.7.0_P1_OPERATIONAL_HARDENED.zip" --output "$archive"
          echo "bc0f544210e17d8064f40d22d32dbe03661420f1c26dae2666e683bdf7dc0837  $archive" | sha256sum --check --strict
          python - "$archive" <<'PY'
          import stat, sys, zipfile
          from pathlib import PurePosixPath
          archive_path = sys.argv[1]
          blocked_suffixes = (".sqlite3", ".sqlite", ".sqlite3-wal", ".sqlite3-shm", ".db", ".pem", ".key", ".p12", ".pfx", ".jks")
          blocked_dirs = {".git", "__pycache__", ".pytest_cache", ".ruff_cache", ".venv", "venv", "build", "dist"}
          blocked_names = {"id_rsa", "id_ed25519", "credentials.json", "client_secret.json", "token.json"}
          with zipfile.ZipFile(archive_path) as archive:
              infos = archive.infolist()
              if len(infos) > 10000:
                  raise SystemExit("archive exceeds entry limit")
              seen, total = set(), 0
              for info in infos:
                  name = info.filename
                  if not name or "\\" in name:
                      raise SystemExit(f"invalid archive path: {name!r}")
                  normalized = name[:-1] if info.is_dir() and name.endswith("/") else name
                  path = PurePosixPath(normalized)
                  if path.is_absolute() or not path.parts or ".." in path.parts or "." in path.parts or ":" in path.parts[0]:
                      raise SystemExit(f"unsafe archive path: {name!r}")
                  canonical = "/".join(path.parts).casefold()
                  if canonical in seen:
                      raise SystemExit(f"duplicate archive path: {name!r}")
                  seen.add(canonical)
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode) or info.flag_bits & 1:
                      raise SystemExit(f"symlink/encrypted member rejected: {name!r}")
                  parts = {part.casefold() for part in path.parts}
                  base = path.name.casefold()
                  if parts & blocked_dirs or any(part.endswith(".egg-info") for part in parts):
                      raise SystemExit(f"build/cache path rejected: {name!r}")
                  if base != ".env.example" and (base == ".env" or base.startswith(".env.")):
                      raise SystemExit(f"environment file rejected: {name!r}")
                  if base.endswith(blocked_suffixes) or base in blocked_names:
                      raise SystemExit(f"database/secret file rejected: {name!r}")
                  if not info.is_dir():
                      total += info.file_size
                      if info.file_size > 20 * 1024 * 1024:
                          raise SystemExit(f"member too large: {name!r}")
                      if info.file_size and (not info.compress_size or info.file_size / info.compress_size > 1000):
                          raise SystemExit(f"suspicious compression ratio: {name!r}")
              if total > 100 * 1024 * 1024:
                  raise SystemExit("archive expands beyond 100 MiB")
          print("Pre-extraction ZIP policy: PASS")
          PY
          mkdir -p "$RUNNER_TEMP/v17-source"
          python -m zipfile -e "$archive" "$RUNNER_TEMP/v17-source"
      - name: Install scanner
        run: |
          case "${{ matrix.scanner }}" in
            bandit) python -m pip install "bandit>=1.8,<2" ;;
            pip-audit)
              # Keep the audit toolchain isolated from the application dependency graph.
              python -m pip install "pip-audit==2.10.1"
              runtime_venv="$RUNNER_TEMP/v17-runtime"
              python -m venv "$runtime_venv"
              "$runtime_venv/bin/python" -m pip install --upgrade pip
              "$runtime_venv/bin/python" -m pip install --upgrade "setuptools>=84.1.0"
              "$runtime_venv/bin/python" -m pip install "$RUNNER_TEMP/v17-source[all,firecrawl,secrets,backup]"
              "$runtime_venv/bin/python" -m pip check
              # Audit only runtime site-packages; the local application itself is not a PyPI dependency.
              "$runtime_venv/bin/python" -m pip uninstall -y v17-niche-intelligence
              runtime_site="$("$runtime_venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
              echo "V17_RUNTIME_SITE=$runtime_site" >> "$GITHUB_ENV"
              ;;
            semgrep) python -m pip install "semgrep>=1.100,<2" ;;
          esac
      - name: Run scanner
        working-directory: ${{ runner.temp }}/v17-source
        run: |
          case "${{ matrix.scanner }}" in
            bandit) bandit -q -ll -r v17_niche_intel ;;
            pip-audit) pip-audit --strict --path "$V17_RUNTIME_SITE" ;;
            semgrep) semgrep scan --config p/security-audit --severity ERROR --error v17_niche_intel ;;
          esac
